name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Supported PostgreSQL versions: 16 and 17 (docs/developer/getting-started/install-binary.md).
  test:
    name: test (pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: wpgo
          POSTGRES_USER: wpgo
          POSTGRES_PASSWORD: wpgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpgo -d wpgo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "0"
      PURSAE_TEST_ADMIN_DB: postgres://wpgo:wpgo@localhost:5432/wpgo?sslmode=disable
      PURSAE_TEST_DB: postgres://wpgo:wpgo@localhost:5432/wpgo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet ./...
      # Development builds (make dev, the development compose file) compile the devhub files, which the
      # default build never sees.
      - name: vet and test (devhub build)
        run: |
          go vet -tags devhub ./...
          go test -tags devhub -count=1 ./internal/config
      # The release and Docker binary: static, -tags nodynamic (tools/release.sh, docker/Dockerfile).
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -o /dev/null ./cmd/wpgo
      # The plugin SDK and the example plugins compile to WASI reactors (tools/build-plugins.sh).
      - name: SDK and example plugins (wasip1)
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go vet ./sdk/... ./examples/plugins/...
          for d in examples/plugins/*/; do
            if [ -f "$d/plugin.json" ]; then go build -buildmode=c-shared -o /dev/null "./$d"; fi
          done
      # TestBackupPgDumpRoundTrip runs the documented pg_dump / pg_restore backup. The runner's own
      # client may be older than the service's server, so wrappers run the tools of the service
      # container itself (stdin/stdout only, the test passes no files).
      - name: pg_dump and pg_restore of the database server
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pgbin"
          for t in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker exec -i %s %s "$@"\n' "$PG_CONTAINER" "$t" > "$RUNNER_TEMP/pgbin/$t"
            chmod +x "$RUNNER_TEMP/pgbin/$t"
          done
          echo "PURSAE_TEST_PG_BIN=$RUNNER_TEMP/pgbin" >> "$GITHUB_ENV"
      # -p 1: the server, store and settings packages each drop and recreate PURSAE_TEST_DB.
      - name: test
        run: go test ./... -p 1 -count=1 -timeout 40m

  # The branch protection on main requires a check called `test`; the matrix legs report as test (pg16) and
  # test (pg17). This job keeps the `test` context and fails unless every leg succeeded (a failed, cancelled
  # or skipped leg fails it).
  test-result:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every PostgreSQL leg passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          test "$RESULT" = success

  # Upgrade path: v0.2.0 and the three newest releases each install and fill a site, then this commit
  # migrates and serves it and checks that every user, post, page, term, comment, menu, media file,
  # option and Web Builder page is unchanged (tools/upgrade-test.sh, make upgrade-test).
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wpgo
          POSTGRES_USER: wpgo
          POSTGRES_PASSWORD: wpgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpgo -d wpgo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "0"
      UPGRADE_ADMIN_DSN: postgres://wpgo:wpgo@localhost:5432/wpgo?sslmode=disable
      # Each release builds with the Go its go.mod asks for.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: upgrade test
        run: tools/upgrade-test.sh

  # Data races in the unit tests (no database: the integration tests skip without PURSAE_TEST_DB).
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test -race
        run: go test -race -count=1 -timeout 30m ./...

  # Pursae Web Builder: host unit tests, UI string lint, dist audit and BUILD.json against the pin
  # (make builder-test; needs the public builder/upstream submodule and Node 22).
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: builder/.nvmrc
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make builder-test
        run: make builder-test

  # golangci-lint with .golangci.yml (bug-finding linters only). The tree predates it and has older
  # findings, so only issues introduced by the pull request or push fail the job (make lint does the same
  # against origin/main). Keep the version in step with GOLANGCI_LINT_VERSION in the Makefile.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull requests compare against the merge base locally: the action's only-new-issues fetches
          # the PR diff from the API, which GitHub refuses for more than 300 files, and then lints the
          # whole tree. Full history, so origin/<base> and the merge base are there.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: --timeout 15m ${{ github.event_name == 'pull_request' && format('--new-from-merge-base=origin/{0}', github.base_ref) || '' }}

  # Pinned like every other tool here; Dependabot does not see `go run pkg@version`, so bump it by hand.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The WP to Pursae WordPress plugin (integrations/wordpress): php -l on the oldest PHP it supports (7.4),
  # its unit tests and the WordPress coding standards. The end-to-end test with WordPress + WooCommerce is wp2p-e2e.yml.
  wordpress-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer
          coverage: none
      - name: php -l (PHP 7.4)
        run: find integrations/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests (multisite guard, resumed package encryption, content batches, cleanup)
        run: php integrations/wordpress/test/unit/run.php
      - name: WordPress coding standards
        run: |
          mkdir -p "$RUNNER_TEMP/phpcs" && cd "$RUNNER_TEMP/phpcs"
          composer init -n -q --name=ci/phpcs
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require -q --dev wp-coding-standards/wpcs:^3.1 dealerdirect/phpcodesniffer-composer-installer
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/phpcs/vendor/bin/phpcs" --standard=WordPress --extensions=php --warning-severity=0 \
            --runtime-set testVersion 7.4- --runtime-set text_domain wp-to-pursae integrations/wordpress/wp-to-pursae

  # The Windows release binary: vet, unit tests (integration tests skip without PURSAE_TEST_DB), then a
  # smoke run of the release build against the runner's preinstalled PostgreSQL: migrate, serve,
  # /healthz and the install screen.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
    steps:
      # Byte-identical checkout: golden files, patch hashes and templates are compared as LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test -count=1 -timeout 30m ./...
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -o pursae.exe ./cmd/wpgo
      - name: smoke run
        shell: pwsh
        env:
          DATABASE_URL: postgres://postgres:root@localhost:5432/postgres?sslmode=disable
          PURSAE_ADDR: 127.0.0.1:8080
          PURSAE_SITE_URL: http://127.0.0.1:8080
          PURSAE_HUB: "off"
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          .\pursae.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\pursae.exe migrate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath .\pursae.exe -ArgumentList serve -PassThru -NoNewWindow -RedirectStandardError serve.err -RedirectStandardOutput serve.out
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            .\pursae.exe healthcheck 2>$null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          if (-not $ok) { Get-Content serve.out, serve.err; exit 1 }
          # The installer is locked by the setup token: refused without it, open with the link that
          # `setup-token` prints (a new token, replacing the one serve generated).
          $code = curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8080/wp-admin/install
          if ($code -ne "403") { Write-Output "install without token: $code"; exit 1 }
          $out = @(.\pursae.exe setup-token)
          $link = $out[0]
          if ($LASTEXITCODE -ne 0 -or $link -notmatch "/wp-admin/install\?token=") { Write-Output "setup-token: $link"; exit 1 }
          $body = curl.exe -s -L -c jar.txt -b jar.txt $link
          if ($LASTEXITCODE -ne 0 -or ($body -join "`n") -notmatch 'name="language"') { Write-Output "install with token failed"; exit 1 }
          $code = curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8080/
          Write-Output "front page: $code"
          if ($code -ne "302" -and $code -ne "200") { exit 1 }
          Stop-Process -Id $p.Id
          Get-Content serve.err | Select-Object -Last 20

  # The Linux and macOS release binaries (tools/release.sh flags), smoke-run by tools/smoke-test.sh:
  # version, migrate, serve, healthcheck, the installer locked without the setup token and open with
  # the `setup-token` link, an install through it, and the front page.
  smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wpgo
          POSTGRES_USER: wpgo
          POSTGRES_PASSWORD: wpgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpgo -d wpgo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -ldflags "-s -w" -o pursae ./cmd/wpgo
      - name: static binary
        run: |
          file pursae
          if file pursae | grep -q 'dynamically linked\|interpreter'; then exit 1; fi
      - name: smoke test
        env:
          DATABASE_URL: postgres://wpgo:wpgo@localhost:5432/wpgo?sslmode=disable
        run: tools/smoke-test.sh ./pursae

  # macos-latest is arm64 (the release's darwin-arm64 binary). PostgreSQL 17 from Homebrew, initialised
  # and started for the job.
  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: PostgreSQL 17
        run: |
          brew install postgresql@17
          pg="$(brew --prefix postgresql@17)/bin"
          "$pg/initdb" -D "$RUNNER_TEMP/pgdata" -U wpgo --auth=trust -E UTF8 >/dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -k $RUNNER_TEMP" -w start
          "$pg/createdb" -h 127.0.0.1 -U wpgo wpgo
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -ldflags "-s -w" -o pursae ./cmd/wpgo
      - name: smoke test
        env:
          DATABASE_URL: postgres://wpgo@127.0.0.1:5432/wpgo?sslmode=disable
        run: tools/smoke-test.sh ./pursae

  # The container image (docker/Dockerfile, not pushed): it builds, starts against PostgreSQL, passes its
  # own HEALTHCHECK command and /healthz, runs as the unprivileged user and locks the installer.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wpgo
          POSTGRES_USER: wpgo
          POSTGRES_PASSWORD: wpgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpgo -d wpgo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -f docker/Dockerfile --build-arg VERSION=0.0.0-ci -t pursae:ci .
      - name: run the image
        run: |
          docker run -d --name pursae --network host \
            -e DATABASE_URL='postgres://wpgo:wpgo@127.0.0.1:5432/wpgo?sslmode=disable' \
            -e PURSAE_ADDR=127.0.0.1:8080 -e PURSAE_SITE_URL=http://127.0.0.1:8080 -e PURSAE_HUB=off \
            pursae:ci
          ok=0
          for i in $(seq 1 90); do
            if docker exec pursae wpgo healthcheck >/dev/null 2>&1; then ok=1; break; fi
            [ "$(docker inspect -f '{{.State.Running}}' pursae)" = true ] || break
            sleep 1
          done
          [ "$ok" = 1 ] || { docker logs pursae 2>&1 | tail -50; echo "the container did not become healthy"; exit 1; }
      - name: check the container
        run: |
          set -x
          docker exec pursae wpgo version | grep -q 0.0.0-ci
          [ "$(docker exec pursae id -u)" = 10001 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/wp-admin/install)" = 403 ]
          link=$(docker exec pursae wpgo setup-token | head -1)
          curl -s -L -c jar -b jar "$link" | grep -q 'name="language"'
          docker exec pursae test -f /usr/share/doc/pursae/LICENSE
      - name: container log
        if: always()
        run: docker logs pursae 2>&1 | tail -100 || true

  # wp-admin in a browser (make e2e-run, builder/test/e2e): the release binary on an empty database is
  # installed through the setup-token link; an administrator logs in, publishes a post in the block
  # editor, uploads an image, opens Dashboard › Updates and logs out, with no console errors.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wpgo
          POSTGRES_USER: wpgo
          POSTGRES_PASSWORD: wpgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpgo -d wpgo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: builder/.nvmrc
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: npm ci
        run: cd builder && npm ci --ignore-scripts --no-audit --no-fund
      - name: Playwright Chromium
        run: cd builder && npx playwright install --with-deps chromium
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -ldflags "-s -w" -o bin/pursae ./cmd/wpgo
      - name: make e2e-run
        run: make e2e-run E2E_DATABASE_URL='postgres://wpgo:wpgo@localhost:5432/wpgo?sslmode=disable'
      - name: upload the server log and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: builder/.work/e2e/
          retention-days: 7
