{{template "header" .}}
<header class="page-header">
	<h1 class="page-title">Search results for: <span class="search-term">{{.SearchQuery}}</span></h1>
	<p class="search-result-count">{{plural .TotalPosts "%s result" "%s results"}}</p>
</header><!-- .page-header -->
{{if .Posts}}<div class="post-list">
	{{range .Posts}}{{template "content" .}}
	{{end}}
</div>
{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
{{template "footer" .}}
